# ============================================================
# UNIVERSAL SCIENTIFIC FIGURE STYLE
# ============================================================

identity:
  name: "Sunghyun Blog Figure Style"
  version: "3.0"
  style: "dark-glass-scientific"


# ============================================================
# CANVAS
# ============================================================

canvas:
  background: "#05070A"

  aspect_ratios:
    landscape: "16:9"
    square: "1:1"
    portrait: "4:5"

  resolution:
    width: 1920
    height: 1080

  margins:
    outer: 0.60
    inner: 0.30

  whitespace:
    generous: true


# ============================================================
# COLOR SYSTEM
# ============================================================

colors:

  background: "#05070A"

  foreground:
    primary: "#F3EEE4"
    secondary: "#D8D2C7"
    muted: "#9B9891"

  neutral:
    50:  "#F3EEE4"
    100: "#DDD8CF"
    200: "#C5C1B9"
    300: "#A8A59F"
    400: "#8A8985"
    500: "#6B6C6C"
    600: "#4C5054"
    700: "#32373D"
    800: "#1B2026"
    900: "#05070A"

  palette:

    blue:
      main: "#58C4DD"
      bright: "#7AD7EE"
      light: "#A9E6F3"
      dark: "#1D5968"
      glass: "#183A46"

    cyan:
      main: "#5CE1E6"
      bright: "#80F2F4"
      light: "#A9FAFA"
      dark: "#21686C"
      glass: "#173E42"

    teal:
      main: "#5CD0B3"
      bright: "#75E6C7"
      light: "#A8F1DF"
      dark: "#236355"
      glass: "#173B34"

    green:
      main: "#83C167"
      bright: "#9ED982"
      light: "#C1E9AF"
      dark: "#3D682F"
      glass: "#263D22"

    yellow:
      main: "#FFFF00"
      bright: "#FFFF55"
      light: "#FFFFA0"
      dark: "#7D7D19"
      glass: "#464615"

    orange:
      main: "#FFB347"
      bright: "#FFC56D"
      light: "#FFE0AA"
      dark: "#80561D"
      glass: "#493217"

    red:
      main: "#FC6255"
      bright: "#FF7B70"
      light: "#FFAAA3"
      dark: "#7F302B"
      glass: "#461F1D"

    purple:
      main: "#9A72AC"
      bright: "#B58AC7"
      light: "#D6B9E1"
      dark: "#513B5D"
      glass: "#30223A"

    pink:
      main: "#D147BD"
      bright: "#E569D2"
      light: "#F0A7E4"
      dark: "#6A245F"
      glass: "#40183A"


# ============================================================
# TYPOGRAPHY
# ============================================================

typography:

  fonts:
    sans: "Microsoft Sans Serif"
    math: "Cambria Math"
    mono: "Consolas"

  default_family: "Microsoft Sans Serif"

  color:
    primary: "#F3EEE4"
    secondary: "#D8D2C7"
    muted: "#9B9891"

  sizes:
    title: 42
    heading: 34
    subheading: 30
    body: 27
    label: 24
    annotation: 21
    small: 18

    math: 30
    math_large: 36
    math_small: 24

  weights:
    title: "SEMIBOLD"
    heading: "MEDIUM"
    body: "NORMAL"
    label: "NORMAL"

  spacing:
    line_height: 1.15
    tracking: 0.0

  alignment:
    default: "left"


# ============================================================
# STROKES
# ============================================================

strokes:

  width:
    hairline: 1.2
    thin: 1.8
    normal: 2.6
    medium: 3.2
    thick: 4.0
    emphasis: 5.0

  color:
    primary: "#F3EEE4"
    secondary: "#58C4DD"
    muted: "#777D82"

  caps:
    default: "round"

  joins:
    default: "round"

  luminous:
    enabled: true
    opacity: 0.95


# ============================================================
# SHAPES
# ============================================================

shapes:

  corners:
    small: 0.08
    normal: 0.16
    large: 0.28
    pill: 0.50

  fill:
    primary: "#183A46"
    secondary: "#263D22"
    accent: "#30223A"

    default_opacity: 0.72
    soft_opacity: 0.50
    subtle_opacity: 0.18

  outline:
    color: "#58C4DD"
    width: 2.6

  circle:
    outline_width: 3.0

  rectangle:
    corner_radius: 0.16

  rounded_rectangle:
    corner_radius: 0.24


# ============================================================
# SURFACES
# ============================================================

surfaces:

  primary:
    fill: "#183A46"
    fill_opacity: 0.72
    stroke: "#58C4DD"
    stroke_opacity: 1.0

  secondary:
    fill: "#263D22"
    fill_opacity: 0.68
    stroke: "#83C167"
    stroke_opacity: 1.0

  accent:
    fill: "#30223A"
    fill_opacity: 0.70
    stroke: "#9A72AC"
    stroke_opacity: 1.0

  warm:
    fill: "#493217"
    fill_opacity: 0.68
    stroke: "#FFB347"
    stroke_opacity: 1.0

  negative:
    fill: "#461F1D"
    fill_opacity: 0.68
    stroke: "#FC6255"
    stroke_opacity: 1.0

  neutral:
    fill: "#1B2026"
    fill_opacity: 0.78
    stroke: "#D8D2C7"
    stroke_opacity: 0.90


# ============================================================
# LINES
# ============================================================

lines:

  default:
    color: "#F3EEE4"
    width: 2.4
    opacity: 0.95

  primary:
    color: "#58C4DD"
    width: 2.6
    opacity: 1.0

  secondary:
    color: "#83C167"
    width: 2.4
    opacity: 0.95

  tertiary:
    color: "#9A72AC"
    width: 2.4
    opacity: 0.95

  guide:
    color: "#777D82"
    width: 1.6
    opacity: 0.60

  dashed:
    dash_length: 0.18
    gap_length: 0.14
    width: 2.4
    cap: "round"

  dotted:
    dot_radius: 0.035
    gap: 0.12


# ============================================================
# ARROWS
# ============================================================

arrows:

  color: "#F3EEE4"
  stroke_width: 2.8

  tip:
    length: 0.20

  geometry:
    rounded: true
    shaft_cap: "round"
    buff: 0.06

  variants:

    primary:
      color: "#F3EEE4"
      width: 2.8

    secondary:
      color: "#58C4DD"
      width: 2.6

    tertiary:
      color: "#83C167"
      width: 2.6


# ============================================================
# CONNECTORS
# ============================================================

connectors:

  color: "#F3EEE4"
  width: 2.2
  opacity: 0.92

  curvature:
    default: 0.12
    soft: 0.20

  endpoints:
    rounded: true


# ============================================================
# LABELS
# ============================================================

labels:

  color: "#F3EEE4"
  font_size: 24

  background:
    enabled: false
    color: "#05070A"
    opacity: 0.90

  padding:
    horizontal: 0.12
    vertical: 0.06

  offset:
    default: 0.18
    small: 0.10
    large: 0.28


# ============================================================
# ANNOTATIONS
# ============================================================

annotations:

  text:
    color: "#D8D2C7"
    size: 20

  line:
    color: "#58C4DD"
    width: 1.8

  highlight:
    color: "#58C4DD"
    opacity: 0.16


# ============================================================
# AXES
# ============================================================

axes:

  color: "#B8B8B3"
  width: 1.7

  ticks:
    color: "#8A8D8F"
    width: 1.3
    length: 0.08

  labels:
    color: "#D8D2C7"
    size: 20

  grid:
    enabled: false
    color: "#32373D"
    width: 1.0
    opacity: 0.45


# ============================================================
# PLOTS
# ============================================================

plots:

  line_width: 2.4

  marker:
    size: 5
    edge_width: 1.2

  grid:
    enabled: false

  frame:
    top: false
    right: false

  series_order:
    - "#58C4DD"
    - "#FFFF00"
    - "#83C167"
    - "#FC6255"
    - "#9A72AC"
    - "#5CD0B3"


# ============================================================
# PANELS / CARDS
# ============================================================

panels:

  background: "#10151B"

  border:
    color: "#2C343C"
    width: 1.2

  corner_radius: 0.22

  padding: 0.30

  shadow:
    enabled: false


# ============================================================
# EMPHASIS
# ============================================================

emphasis:

  primary:
    color: "#58C4DD"

  secondary:
    color: "#FFFF00"

  tertiary:
    color: "#83C167"

  warning:
    color: "#FFB347"

  negative:
    color: "#FC6255"

  positive:
    color: "#83C167"

  highlight_opacity: 0.16


# ============================================================
# GLOW / LUMINANCE
# ============================================================

glow:

  enabled: true

  subtle:
    opacity: 0.12
    scale: 1.04

  normal:
    opacity: 0.20
    scale: 1.07

  emphasis:
    opacity: 0.30
    scale: 1.10

  colors:
    blue: "#58C4DD"
    green: "#83C167"
    yellow: "#FFFF00"
    purple: "#9A72AC"
    red: "#FC6255"


# ============================================================
# GLASS EFFECT
# ============================================================

glass:

  enabled: true

  fill_opacity:
    strong: 0.78
    normal: 0.68
    subtle: 0.45

  border_opacity:
    strong: 1.0
    normal: 0.90

  contrast:
    fill_to_border: 0.55

  rule:
    darker_fill_brighter_edge: true


# ============================================================
# DEPTH / LAYERS
# ============================================================

layers:

  background: 0
  glow: 5
  guides: 10
  shapes: 20
  connectors: 30
  arrows: 40
  labels: 50
  annotations: 60


# ============================================================
# LAYOUT
# ============================================================

layout:

  spacing:
    xs: 0.10
    sm: 0.18
    md: 0.32
    lg: 0.52
    xl: 0.80
    xxl: 1.10

  alignment:
    prefer_symmetry: true
    prefer_visual_balance: true

  composition:
    avoid_edge_crowding: true
    prefer_centered_subject: true
    use_generous_whitespace: true


# ============================================================
# ANIMATION
# ============================================================

animation:

  duration:
    fast: 0.35
    normal: 0.60
    slow: 1.00

  easing:
    default: "smooth"

  transitions:
    subtle: true

  movement:
    prefer_small_displacements: true
    avoid_bouncy_motion: true

  fade:
    default_duration: 0.45


# ============================================================
# EXPORT
# ============================================================

export:

  raster:
    format: "png"
    transparent_background: false

  video:
    format: "mp4"
    fps: 30

  quality:
    default: "high"

  anti_aliasing: true


# ============================================================
# GLOBAL VISUAL RULES
# ============================================================

rules:

  prefer:
    - near_black_background
    - cream_neutral_geometry
    - luminous_colored_edges
    - dark_tinted_glass_fills
    - jewel_tone_accents
    - brighter_border_than_fill
    - restrained_glow
    - rounded_geometry
    - rounded_line_caps
    - generous_whitespace
    - clean_math
    - minimal_annotations

  avoid:
    - flat_pastel_cards
    - pale_ui_blue_fills
    - pure_white_everywhere
    - excessive_neon
    - rainbow_coloring_without_meaning
    - opaque_bright_fills
    - gradients_without_meaning
    - heavy_shadows
    - decorative_3d_effects
    - sharp_corners
    - dense_text